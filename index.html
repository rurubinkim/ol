<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>아빠 생일 축하해요!</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="sky"></canvas>
  <canvas id="fx"></canvas>

  <div class="moon">🌙</div>
  <div class="cloud c1"></div>
  <div class="cloud c2"></div>
  <div class="cloud c3"></div>

  <main class="stage">
    <section id="intro" class="panel">
      <div class="badge">✨ Birthday Surprise ✨</div>
      <h1>아빠 생일 축하합니다!</h1>
      <p class="hint">선물상자를 눌러보세요 🎁</p>

      <button id="gift" aria-label="선물 열기">
        <span class="lid">🎀</span>
        <span class="box">🎁</span>
        <span class="shine"></span>
      </button>

      <p class="secret">5번 누르면 Golden Mode 👑</p>
    </section>

    <section id="show" class="panel hidden">
      <div class="cake">
        <div class="flame"></div>
        <div class="candle"></div>
        <div class="top">🍓 🍓 🍓</div>
        <div class="layer l1">🎂🎂🎂</div>
        <div class="layer l2">🍰🍰🍰🍰</div>
        <div class="layer l3">🧁🧁🧁🧁🧁</div>
      </div>

      <article id="letter">
        <h2>💌 아빠께</h2>
        <p id="typed"></p>
      </article>

      <div class="final">❤️ 사랑합니다 ❤️</div>
    </section>
  </main>

  <div id="toast">🎆 축하 폭죽 발사!</div>

  <script src="script.js"></script>
</body>
</html>
