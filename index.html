<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>아빠 생일 축하해요!</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;overflow:hidden;min-height:100vh;
  font-family:Arial,sans-serif;text-align:center;color:white;
  background:radial-gradient(circle at top,#173b7a,#030816 75%);
}
canvas{position:fixed;inset:0;z-index:0}
.main{position:relative;z-index:3;padding-top:45px}
h1{
  font-size:clamp(42px,8vw,90px);
  color:#ffe98a;
  text-shadow:0 0 15px #fff,0 0 40px gold,0 0 80px orange;
  animation:pulse 1.4s infinite alternate;
}
@keyframes pulse{to{transform:scale(1.04)}}
.sub{font-size:24px;font-weight:bold}
#gift{
  font-size:clamp(130px,23vw,230px);
  cursor:pointer;
  animation:bounce 1s infinite;
  filter:drop-shadow(0 0 35px gold);
}
@keyframes bounce{50%{transform:translateY(-25px) rotate(5deg)}}
#cake{display:none;font-size:120px;margin-top:10px;animation:pop .6s}
#letter{
  display:none;margin:20px auto;padding:28px;
  width:min(90%,500px);border-radius:28px;
  background:rgba(255,255,255,.16);backdrop-filter:blur(10px);
  box-shadow:0 0 40px gold, inset 0 0 30px rgba(255,255,255,.2);
  font-size:23px;line-height:1.65;animation:pop .7s;
}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.float{
  position:fixed;pointer-events:none;z-index:2;
  animation:fall linear forwards;
}
@keyframes fall{to{transform:translateY(110vh) rotate(900deg);opacity:.9}}
.heart{
  position:fixed;pointer-events:none;z-index:5;font-size:30px;
  animation:heart 3s forwards;
}
@keyframes heart{to{transform:translateY(-600px) scale(2);opacity:0}}
.moon{
  position:fixed;right:55px;top:45px;font-size:70px;z-index:1;
  filter:drop-shadow(0 0 30px #fff);
}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div class="moon">🌙</div>

<div class="main">
  <h1>🎉 아빠 생일 축하합니다! 🎉</h1>
  <p class="sub">선물을 눌러보세요 ✨</p>
  <div id="gift">🎁</div>
  <div id="cake">🎂🕯️✨</div>

  <div id="letter">
    <b>💌 아빠께</b><br><br>
    생일 정말 축하드려요! 🎉<br>
    항상 우리 가족을 위해 열심히 일해주셔서 감사합니다.<br>
    오래오래 건강하시고 행복한 일만 가득하세요.<br><br>
    ❤️ 사랑합니다 ❤️
  </div>
</div>

<script>
const canvas=document.getElementById("sky"),ctx=canvas.getContext("2d");
let W,H,stars=[],fires=[];
function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
resize();addEventListener("resize",resize);

for(let i=0;i<350;i++){
  stars.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*2+0.5,a:Math.random(),s:Math.random()*0.03});
}

function firework(x,y){
  let colors=["#ffd700","#ff4d6d","#4cc9f0","#b8ff60","#ffffff","#ff9f1c"];
  for(let i=0;i<90;i++){
    let ang=Math.random()*Math.PI*2,spd=Math.random()*6+2;
    fires.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,c:colors[Math.floor(Math.random()*colors.length)],life:80});
  }
}

function draw(){
  ctx.clearRect(0,0,W,H);

  for(let s of stars){
    s.a+=s.s;
    ctx.globalAlpha=.3+Math.abs(Math.sin(s.a))*.7;
    ctx.fillStyle="white";
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;

  for(let i=fires.length-1;i>=0;i--){
    let p=fires[i];
    p.x+=p.vx;p.y+=p.vy;p.vy+=0.05;p.life--;
    ctx.globalAlpha=p.life/80;
    ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,3,0,Math.PI*2);ctx.fill();
    if(p.life<=0)fires.splice(i,1);
  }
  ctx.globalAlpha=1;
  requestAnimationFrame(draw);
}
draw();

setInterval(()=>firework(Math.random()*W,80+Math.random()*H*.45),900);

function drop(){
  let e=document.createElement("div");
  e.className="float";
  e.innerHTML=["🎊","🎉","✨","⭐","💛","💙","🎈"][Math.floor(Math.random()*7)];
  e.style.left=Math.random()*100+"vw";
  e.style.top="-50px";
  e.style.fontSize=20+Math.random()*30+"px";
  e.style.animationDuration=3+Math.random()*4+"s";
  document.body.appendChild(e);
  setTimeout(()=>e.remove(),7000);
}
setInterval(drop,70);

function hearts(){
  for(let i=0;i<120;i++){
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML=["❤️","💛","💖","💙"][Math.floor(Math.random()*4)];
    h.style.left=Math.random()*100+"vw";
    h.style.top="85vh";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),3000);
  }
}

gift.onclick=()=>{
  gift.style.display="none";
  cake.style.display="block";
  letter.style.display="block";
  hearts();
  for(let i=0;i<8;i++)setTimeout(()=>firework(Math.random()*W,100+Math.random()*300),i*180);
};
</script>
</body>
</html>
